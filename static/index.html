<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Leitor de PDF</title>
  <link rel="stylesheet" href="app.css?v=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <header class="toolbar">
    <button class="icon-btn" id="btn-open-local" type="button" title="Abrir PDF do aparelho" aria-label="Abrir PDF do aparelho">
      <svg viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2h8.4A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>
    </button>
    <div class="doc-title" id="doc-title">Leitor de PDF</div>
    <button class="icon-btn" id="btn-search" type="button" title="Buscar (Ctrl+F)" aria-label="Buscar" disabled>
      <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5.5 5.5"/></svg>
    </button>
    <button class="icon-btn" id="btn-download" type="button" title="Baixar PDF" aria-label="Baixar PDF" disabled>
      <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14"/></svg>
    </button>
  </header>

  <div class="searchbar" id="searchbar" hidden>
    <input id="search-input" type="search" placeholder="Buscar no documento" autocomplete="off" enterkeyhint="search">
    <span class="search-count" id="search-count"></span>
    <button class="icon-btn small" id="search-prev" type="button" aria-label="Resultado anterior">
      <svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg>
    </button>
    <button class="icon-btn small" id="search-next" type="button" aria-label="Próximo resultado">
      <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <button class="icon-btn small" id="search-close" type="button" aria-label="Fechar busca">
      <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
  </div>

  <div class="banner" id="banner" hidden></div>

  <div class="content">
  <main class="viewer" id="viewer">
    <div class="pages" id="pages"></div>
  </main>

  <div class="state" id="state">
    <div class="state-box">
      <div class="spinner" id="state-spinner"></div>
      <div class="state-icon" id="state-icon" hidden></div>
      <div class="state-title" id="state-title">Carregando…</div>
      <div class="state-text" id="state-text"></div>
      <div class="progress" id="state-progress" hidden><div class="progress-bar" id="state-progress-bar"></div></div>
      <div class="state-actions">
        <button class="btn" id="state-retry" type="button" hidden>Tentar novamente</button>
        <button class="btn secondary" id="state-local" type="button" hidden>Abrir PDF do aparelho</button>
      </div>
    </div>
  </div>
  </div>

  <footer class="bottombar" id="bottombar" hidden>
    <div class="zoom">
      <button class="icon-btn" id="zoom-out" type="button" aria-label="Diminuir zoom">
        <svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>
      </button>
      <button class="zoom-label" id="zoom-label" type="button" title="Ajustar à largura">100%</button>
      <button class="icon-btn" id="zoom-in" type="button" aria-label="Aumentar zoom">
        <svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg>
      </button>
    </div>
    <form class="pager" id="pager" autocomplete="off">
      <span>Página</span>
      <input id="page-input" type="text" inputmode="numeric" pattern="[0-9]*" value="1" aria-label="Ir para a página">
      <span>de <b id="page-count">1</b></span>
    </form>
  </footer>

  <input type="file" id="file-input" accept="application/pdf,.pdf" hidden>
  <script src="app.js?v=1"></script>
</body>
</html>
